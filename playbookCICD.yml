---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: "latest"
    dockerfile_path: './'
    docker_registry_username: "lina0000"
    k8s_namespace: default

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: yes

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag | string }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag | string }}"
        push: yes
        source: local

    - name: Pull Docker image (verification)
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag | string }}"
        source: pull

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: deployment.yaml
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(omit, true) }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        src: service.yaml
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(omit, true) }}"